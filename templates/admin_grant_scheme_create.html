<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Grant Scheme</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_grant_scheme_create.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/colors.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/researchly_icon.png') }}">
</head>

<body>
  <!-- Top bar -->
  {% include "_topbar.html" %}

  <main class="layout" id="layout">
    <!-- Sidebar (same as admin_dashboard) -->
    <aside class="sidebar" id="sidebar">
      <a class="side-link" href="{{ url_for('admin_dashboard') }}">Admin Dashboard</a>
      <a class="side-link" href="{{ url_for('admin_users', status='PENDING') }}">User Management</a>
      <a class="side-link active" href="{{ url_for('admin_grants') }}">Grant Scheme<br/>Management</a>
      <a class="side-link" href="{{ url_for('admin_funding_list', dept='ALL') }}">Funding Allocation</a>
      <a class="side-link" href="{{ url_for('admin_final_approval_list', dept='ALL') }}">Final Approval<br/>Decision</a>
      <a class="side-link" href="{{ url_for('admin_assign_reviewers', dept='ALL') }}">Assign Reviewers</a>
      <a class="side-link" href="{{ url_for('admin_proposal_list') }}">Proposal List</a>

      <div class="side-spacer"></div>
      <a class="side-link logout" href="{{ url_for('logout') }}">Logout</a>
    </aside>

    <!-- Content -->
    <section class="content">
      <div class="page-wrap">
        <h1 class="title">Create Grant Scheme</h1>

        <form class="form" method="POST">
          <div class="row">
            <label>Department</label>

            <div>
              <input
                type="text"
                name="department_name"
                placeholder="e.g., Computer Science"
                required
              />
            </div>
          </div>

          <div class="row">
            <label>Description</label>
            <input type="text" name="description" placeholder="Enter description">
          </div>

          <div class="row">
            <label>Eligibility</label>
            <input type="text" name="eligibiliity" placeholder="Enter eligibility">
          </div>

          <div class="row">
            <label>Application Period</label>
            <div class="date-range">
              <input type="date" name="open_date">
              <span class="dash">–</span>
              <input type="date" name="close_date">
            </div>
          </div>

          <div class="row">
            <label>Maximum Budget (RM)</label>
            <input type="number" name="max_budget" placeholder="e.g., 50000">
          </div>

          <div class="row">
            <label>Project Duration Limit (Months)</label>
            <input type="number" name="project_duration_limit" placeholder="e.g., 12">
          </div>

          <div class="row">
            <label>Required Documents</label>
            <input type="text" name="required_documents" placeholder="e.g., proposal, CV, quotations">
          </div>

          <div class="row">
            <label>Reporting Requirements</label>
            <input type="text" name="reporting_requirements" placeholder="e.g., monthly report, final report">
          </div>

          <div class="buttons">
            <button class="btn secondary" name="action" value="draft" type="submit">Save Draft</button>
            <button class="btn primary" name="action" value="confirm" type="submit">Confirm Scheme</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const layout = document.getElementById('layout');

    hamburger.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      layout.classList.toggle('sidebar-collapsed');
    });
  </script>

  <script>
    // Date order validation (Draft + Confirm)
    const form = document.querySelector("form.form");
    const openInput = document.querySelector('input[name="open_date"]');
    const closeInput = document.querySelector('input[name="close_date"]');

    function validateDateOrder() {
      // If inputs not found, don't crash
      if (!openInput || !closeInput) return true;

      const open = openInput.value;
      const close = closeInput.value;

      // Only validate when BOTH dates are selected
      if (open && close && close < open) {
        closeInput.setCustomValidity("Closing date must be after opening date.");
        closeInput.reportValidity();
        return false;
      }

      closeInput.setCustomValidity("");
      return true;
    }

    // Validate when dates change
    if (openInput) openInput.addEventListener("change", validateDateOrder);
    if (closeInput) closeInput.addEventListener("change", validateDateOrder);

    // Validate on submit (blocks both Draft and Confirm)
    if (form) {
      form.addEventListener("submit", function (e) {
        if (!validateDateOrder()) e.preventDefault();
      });
    }
  </script>

</body>
</html>
