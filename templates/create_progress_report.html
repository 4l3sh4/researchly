<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Progress Report - Researchly</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/colors.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/researcher_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/researcher_projects.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/researchly_icon.png') }}">
</head>

<body>
<header class="topbar">
    <div class="left">
        <button class="hamburger" type="button">&#9776;</button>
        <div class="brand">Researchly™</div>
    </div>

    <div class="icons">
        <a href="{{ url_for('notifications') }}" class="icon bell"></a>
        <a href="{{ url_for('view_profile') }}" class="icon user">
            {% if prof.profile_picture %}
                <img class="top-avatar"
                     src="{{ url_for('static', filename='uploads/' ~ prof.profile_picture) }}"
                     alt="Profile">
            {% else %}
                <span class="fallback-user">👤</span>
            {% endif %}
        </a>
    </div>
</header>

<main class="layout">
    <aside class="sidebar">
        <a class="side-link" href="{{ url_for('researcher_dashboard') }}">Researcher Dashboard</a>
        <a class="side-link" href="{{ url_for('researcher_proposals') }}">Proposals</a>
        <a class="side-link active" href="{{ url_for('researcher_projects') }}">Projects</a>
        <a class="side-link" href="{{ url_for('researcher_grant_schemes') }}">Grant Scheme</a>

        <div class="side-spacer"></div>
        <a class="side-link logout" href="{{ url_for('logout') }}">Logout</a>
    </aside>

    <section class="content">
        <div class="card">
            <div class="card-top">
                <div>
                    <div class="eyebrow">Progress Report</div>
                    <h1 class="project-title">{{ proposal.project_title }}</h1>
                </div>
                <a class="back-link" href="{{ url_for('view_project', project_id=project.project_id) }}">← Back</a>
            </div>

            <form class="report-form" method="POST">
                <div class="form-row">
                    <div class="form-field">
                        <label for="period_start_date">Start Date</label>
                        <input
                            type="date"
                            id="period_start_date"
                            name="period_start_date"
                            value="{{ form_data.get('period_start_date', '') }}"
                            required>
                    </div>
                    <div class="form-field">
                        <label for="period_end_date">End Date</label>
                        <input
                            type="date"
                            id="period_end_date"
                            name="period_end_date"
                            value="{{ form_data.get('period_end_date', '') }}"
                            required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="summary">Summary</label>
                    <textarea
                        id="summary"
                        name="summary"
                        rows="4"
                        required>{{ form_data.get('summary', '') }}</textarea>
                </div>

                <div class="form-field">
                    <label for="milestones_achieved">Milestones Achieved</label>
                    <textarea
                        id="milestones_achieved"
                        name="milestones_achieved"
                        rows="3"
                        required>{{ form_data.get('milestones_achieved', '') }}</textarea>
                </div>

                <div class="form-field">
                    <label for="challenges">Challenges</label>
                    <textarea
                        id="challenges"
                        name="challenges"
                        rows="3"
                        required>{{ form_data.get('challenges', '') }}</textarea>
                </div>

                <div class="form-field">
                    <label for="resource_usage">Resource Usage</label>
                    <textarea
                        id="resource_usage"
                        name="resource_usage"
                        rows="3"
                        required>{{ form_data.get('resource_usage', '') }}</textarea>
                </div>

                <div class="cta-row">
                    <button class="btn primary" type="submit">Submit Report</button>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
