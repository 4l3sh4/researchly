<header class="topbar">
  <div class="left">
    <button class="hamburger" type="button" aria-label="Menu" id="hamburger">&#9776;</button>
    <div class="brand">Researchly™</div>
  </div>

  <div class="icons">
    <!-- Notifications Bell -->
    <a href="{{ url_for('notifications') }}" class="icon bell" title="Notifications">
      {% if unread_notifications and unread_notifications > 0 %}
        <span class="notif-badge">
          {% if unread_notifications > 99 %}99+{% else %}{{ unread_notifications }}{% endif %}
        </span>
      {% endif %}
    </a>

    <!-- Profile Icon -->
    <a href="{{ url_for('view_profile') }}" class="icon user" title="Profile">
      {% if prof and prof.profile_picture %}
        <img class="top-avatar"
             src="{{ url_for('static', filename='uploads/' ~ prof.profile_picture) }}"
             alt="Profile">
      {% else %}
        <span class="fallback-user">👤</span>
      {% endif %}
    </a>
  </div>
</header>
