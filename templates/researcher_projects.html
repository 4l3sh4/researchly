<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/colors.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/researcher_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/researcher_projects.css') }}">
</head>
<body>

<div class="topbar">
    <div class="menu-icon">☰</div>
    <div class="logo">Researchly™</div>
    <div class="icons">
        <a href="{{ url_for('notifications') }}" class="icon bell"></a>
        <div class="icon user"></div>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <h2>Researcher<br>Dashboard</h2>
        <nav>
            <a href="{{ url_for('researcher_dashboard') }}" class="nav-item">Dashboard</a>
            <a href="{{ url_for('researcher_proposals') }}" class="nav-item">Proposals</a>
            <a href="{{ url_for('researcher_projects') }}" class="nav-item active">Projects</a>
            <a href="{{ url_for('logout') }}" class="nav-item">Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="projects-header">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search" class="search-input">
            </div>
            <select class="filter-dropdown">
                <option>Filter</option>
                <option>In progress</option>
                <option>Completed</option>
                <option>On hold</option>
            </select>
        </div>

        <div class="projects-table-wrapper">
            <table class="projects-table">
                <thead>
                    <tr>
                        <th>Project Name</th>
                        <th>Project Details</th>
                        <th>Status</th>
                        <th>Feedbacks</th>
                    </tr>
                </thead>
                <tbody>
                    {% for project in projects %}
                    <tr>
                        <td class="project-name">{{ project.title }}</td>
                        <td class="project-details">
                            <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn-view">View</a>
                        </td>
                        <td class="project-status">
                            <span class="status-badge status-{{ project.status.lower().replace(' ', '-') }}">
                                {{ project.status }}
                            </span>
                        </td>
                        <td class="project-feedback">
                            <a href="{{ url_for('view_project_feedback', project_id=project.id) }}" class="btn-view">View</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
